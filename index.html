<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Everton's Quiz On</h1> <h1 id=jha>Jhariah</h1>
    <hr />
    <!-- Movie Question -->
    <form id="albumform">
      <label>
        1️⃣ == What was Jhariah's first album? ==
        <select id="album-answer">
          <option value="album1">Trust Ceremony</option>
          <option value="album2">To Mend The Sun</option>
          <option value="album3">A Beginner's Guide to Faking Your Death</option>
          <option value="album4">The Great Table Of How I Ruined It All. </option>
        </select>
      </label>
      <button type="submit">Submit</button>
    </form>
    <div id="album-result">
      <p id="album-text"></p>
    </div>
    <hr />
    <!-- Book Question -->
    <form id="song-form">
      <label>
        2️⃣ == What is my favorite Jhariah song? ==
        <select id="song-answer">
          <option value="song1">FIRE4FUN</option>
          <option value="song2">Flight Of Crows</option>
          <option value="song3">Knives Are Dangerous</option>
          <option value="song4">PRESSURE BOMB 2!!!!</option>
        </select>
      </label>
      <button type="submit">Submit</button>
    </form>
    <div id="song-result">
      <p id="song-text"></p>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#albumform").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#album-answer");
        var answer = $answer.val();

        if (answer === "album4") {
          $("#album-text").text("Correct!");
        } 
        else {
          $("#album-text").text("Incorrect. Try Again.");
        }
      });

      //=======================Book Question jQuery Code
      $("#song-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#song-answer");
        var answer = $answer.val();

        if (answer === "song2") {
          $("#song-text").text("Correct!");
        } 
        else {
          $("#song-text").text("Incorrect. Try Again.");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
