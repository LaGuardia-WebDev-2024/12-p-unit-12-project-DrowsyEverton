<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Everton's Quiz On</h1> <h1 id=jha>Jhariah</h1>
    <hr />
    <!-- Movie Question -->
    <form id="first">
      <label>
        1️⃣ == What was Jhariah's first album? ==
        <select id="movie-answer">
          <option value="movie1">Trust Ceremony</option>
          <option value="movie2">To Mend The Sun</option>
          <option value="movie3">A Beginner's Guide to Faking Your Death</option>
          <option value="movie4">The Great Table Of How I Ruined It All. </option>
        </select>
      </label>
      <button type="submit">Submit</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
    </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        2️⃣ == What is my favorite Jhariah song? ==
        <select id="book-answer">
          <option value="book1">FIRE4FUN</option>
          <option value="book2">Flight Of Crows</option>
          <option value="book3">Knives Are Dangerous</option>
          <option value="book4">PRESSURE BOMB 2!!!!</option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie1") {
          $("#movie-text").text("YESSSS!");
        } 
        else {
          $("#movie-text").text("Try Again!");
        }
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book1") {
          $("#book-text").text("YESSSS!");
        } 
        else {
          $("#book-text").text("Try Again!");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
